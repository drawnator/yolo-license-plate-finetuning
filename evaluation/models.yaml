# Models compared by the benchmark and the dashboard.
#
#   python -m evaluation.benchmark --catalog evaluation/models.yaml   # score every entry
#   python -m evaluation.export_results                               # -> evaluation/results/
#   python -m evaluation.dashboard                                    # http://localhost:8000
#
# Fields:
#   id        short unique name shown in the dashboard
#   ref       where the weights come from (see evaluation/model_store.py):
#             release:<tag> (GitHub release), runs:/<run id>, <name>/<version>, or a file
#   run_id    MLflow training run, when the ref is not already one (benchmark scores are
#             copied onto it as bench.* tags)
#   size      YOLO size: n, s, m, l
#   date      when the model was trained (from the checkpoint)
#   pipeline  how it was made, in a few words
#   notes     anything that matters when comparing it
#   partial   true for an unfinished training (hidden by default in the dashboard)
#
# Models from before MLflow (V1 to v8) exist only as GitHub releases. Releases v9 to v11
# match MLflow runs by date, checkpoint size and validation score.

models:
  - id: V1
    ref: release:V1
    size: n
    date: 2026-05-17
    pipeline: plate + face, first release
    notes: checkpoint from epoch 5, not a finished training
    partial: true
  - id: V2
    ref: release:V2
    size: n
    date: 2026-05-18
    pipeline: plate + face
  - id: V3
