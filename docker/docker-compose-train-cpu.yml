# ──────────────────────────────────────────────────────────────────────────────
# Common environment variables shared by all services
# ──────────────────────────────────────────────────────────────────────────────
x-common-env: &common-env
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  MLFLOW_TRACKING_URI: "https://mlflow.guilherme.zip"
  MLFLOW_TRACKING_USERNAME: "${MLFLOW_TRACKING_USERNAME:-admin}"
  MLFLOW_TRACKING_PASSWORD: "${MLFLOW_TRACKING_PASSWORD}"
  GIT_COMMIT_HASH: "${GIT_COMMIT_HASH:-unknown}"
  # Celeron G3930 lacks AVX/AVX2/FMA/BMI — skip Polars CPU feature check
  POLARS_SKIP_CPU_CHECK: "1"

services:
  # ── CPU training service ────────────────────────────────────────────────────
  train-cpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile.cpu
    container_name: yolo_train_cpu
    environment:
      <<: *common-env
    volumes:
      - ./datasets:/datasets          # persist datasets on host across rebuilds
    shm_size: '8gb'
    # Three-stage pipeline: synthetic → pretrain strong teacher → pseudo-label → final train.
    # CPU variant with fewer synthetic images and epochs.
    # Uses the CMD from Dockerfile. Override with:
    #   docker compose run train-cpu python training/train_yolov26.py
    #   docker compose run train-cpu python -m pseudo_labeling pipeline --regenerate
    #   docker compose run train-cpu python training/train_pipeline.py --synthetic 500 --pretrain --device cpu
