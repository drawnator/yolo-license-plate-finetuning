
# ──────────────────────────────────────────────────────────────────────────────
# Common environment variables shared by all services
# ──────────────────────────────────────────────────────────────────────────────
x-common-env: &common-env
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  MLFLOW_TRACKING_URI: "https://mlflow.guilherme.zip"
  MLFLOW_TRACKING_USERNAME: "${MLFLOW_TRACKING_USERNAME:-admin}"
  MLFLOW_TRACKING_PASSWORD: "${MLFLOW_TRACKING_PASSWORD}"

# ──────────────────────────────────────────────────────────────────────────────
# Volume mounts
# ──────────────────────────────────────────────────────────────────────────────
# x-volumes: &volumes
  # - ./datasets:/datasets          # dataset directory

services:
  # ── GPU training service ────────────────────────────────────────────────────
  train-gpu:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: yolo_train_gpu
    environment:
      <<: *common-env
    volumes:
      - ./datasets:/datasets          # persist datasets on host across rebuilds
    image: nvidia/cuda:13.0.3-cudnn-runtime-ubi8
    shm_size: '8gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Three-stage pipeline: synthetic → pretrain strong teacher → pseudo-label → final train.
    # Uses the CMD from Dockerfile. Override with:
    #   docker compose run train-gpu python training/train_yolov26.py
    #   docker compose run train-gpu python -m pseudo_labeling pipeline --regenerate
    #   docker compose run train-gpu python training/train_pipeline.py --synthetic 10000 --pretrain
