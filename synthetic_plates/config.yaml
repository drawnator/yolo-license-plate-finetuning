# Synthetic Plates Configuration
# ==============================
# Default parameters for generating and overlaying synthetic Brazilian
# license plates. All values can be overridden via CLI flags.

# Plate rendering
plate:
  width: 400
  height: 130
  mercosul_band_height: 20

# Overlay parameters (see OverlayParams dataclass for details)
overlay:
  scale_min: 0.03
  scale_max: 0.12
  pitch_min: -30.0
  pitch_max: 30.0
  yaw_min: -40.0
  yaw_max: 40.0
  roll_min: -10.0
  roll_max: 10.0
  pos_x_min: 0.10
  pos_x_max: 0.90
  pos_y_min: 0.10
  pos_y_max: 0.90
  blur_prob: 0.4
  blur_kernel_min: 1
  blur_kernel_max: 5
  brightness_min: 0.7
  brightness_max: 1.3
  contrast_min: 0.7
  contrast_max: 1.3
  edge_feather: 2
  noise_prob: 0.3
  noise_stddev: 5.0

# Dataset builder defaults
dataset:
  plates_per_image: 1
  max_plates_per_image: 3
  val_split: 0.1
  test_split: 0.05

# Online augmentation (for training)
augmentation:
  prob: 0.5
  plates_per_image: 1